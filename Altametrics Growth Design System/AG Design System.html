<!doctype html>
<!-- @dsCard group="Brand" name="AG Design System — gallery" subtitle="Interactive gallery — ~45 components, 9 patterns, light/dark" viewport="1280x760" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AG Design System</title>

<!-- Foundation fonts: Inter (UI) + Phosphor icon families + AG custom global icon font -->
<!-- Mono uses a system-monospace stack (no CDN). Inter + icon fonts are self-hosted. -->

<!-- Phosphor icons via Iconify web component (reliable on-demand SVG) -->
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>

<!-- AG custom global icon font (fn-global-*) -->
<link rel="stylesheet" href="global-icons.css" />

<!-- AG design tokens + DS chrome -->
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="ds-styles.css" />

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Primitives + helpers (Button, Input, Select, etc. — facsimiles of fn-* / hw-* components) -->

  <script type="text/babel" src="src/view-connect.jsx"></script>
  <script type="text/babel" src="src/view-components.jsx"></script>
  <script type="text/babel" src="src/view-hw-header.jsx"></script>
  <script type="text/babel" src="src/view-app-market.jsx"></script>
  <script type="text/babel" src="src/view-patterns.jsx"></script>
  <script type="text/babel" src="src/view-restaurant.jsx"></script>
  <script type="text/babel" src="src/view-a11y.jsx"></script>

  <script type="text/babel" src="src/view-tour.jsx"></script>
