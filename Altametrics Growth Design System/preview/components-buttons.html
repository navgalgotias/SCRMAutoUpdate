<!-- @dsCard group="Components" -->
<!doctype html>
<html><head><meta charset="utf-8">
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<link rel="stylesheet" href="_base.css"></head>
<body><div class="card">
  <div class="col"><div class="eyebrow">Buttons · solid</div><div class="muted" style="font-size:12px">Semantic fills · hover darkens to the <code class="mono">*Dark</code> token · icons via <code class="mono">iconAddonBefore/After</code></div></div>
  <div class="row" style="gap:8px">
    <button class="btn btn-primary">Primary</button>
    <button class="btn btn-success">Success</button>
    <button class="btn btn-danger">Danger</button>
    <button class="btn btn-orange">Orange</button>
    <button class="btn btn-warning">Warning</button>
    <button class="btn btn-info">Info</button>
    <button class="btn btn-dark">Dark</button>
  </div>
  <div class="col" style="margin-top:4px"><div class="eyebrow">Outline</div></div>
  <div class="row" style="gap:8px">
    <button class="btn btn-outline-primary">Outline</button>
    <button class="btn btn-outline-secondary">Secondary</button>
    <button class="btn btn-outline-success">Success</button>
    <button class="btn btn-outline-danger">Danger</button>
  </div>
  <div class="col" style="margin-top:4px"><div class="eyebrow">Sizes &amp; shape</div></div>
  <div class="row" style="gap:8px">
    <button class="btn btn-primary btn-xs">xs</button>
    <button class="btn btn-primary btn-sm">sm</button>
    <button class="btn btn-primary">default</button>
    <button class="btn btn-primary btn-lg">lg</button>
    <button class="btn btn-primary btn-round"><iconify-icon icon="ph:plus"></iconify-icon> round</button>
    <button class="btn btn-primary btn-square">square</button>
    <button class="btn btn-primary" disabled>disabled</button>
  </div>
  <div class="col" style="margin-top:4px"><div class="eyebrow">With icons</div></div>
  <div class="row" style="gap:8px">
    <button class="btn btn-outline-primary"><iconify-icon icon="ph:arrows-clockwise"></iconify-icon> Refresh</button>
    <button class="btn btn-primary btn-round"><iconify-icon icon="ph:plus"></iconify-icon> Add shift</button>
    <button class="btn btn-outline-secondary">Continue <iconify-icon icon="ph:arrow-right"></iconify-icon></button>
    <button class="btn btn-danger"><iconify-icon icon="ph:trash"></iconify-icon> Delete</button>
  </div>
</div></body></html>
