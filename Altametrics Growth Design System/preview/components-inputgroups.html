<!doctype html>
<html><head><meta charset="utf-8">
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<link rel="stylesheet" href="_base.css"></head>
<body><div class="card">
  <div class="col"><div class="eyebrow">Input groups</div><div class="muted" style="font-size:12px"><code class="mono">.input-group</code> with <code class="mono">.input-group-text</code> add-ons · icon prefix, currency prefix + suffix</div></div>
  <div style="display:flex;flex-direction:column;gap:14px">
    <div class="input-group">
      <span class="input-group-text"><iconify-icon icon="ph:magnifying-glass"></iconify-icon></span>
      <input class="form-control" placeholder="Search shifts">
    </div>
    <div class="input-group">
      <span class="input-group-text">$</span>
      <input class="form-control" placeholder="0.00">
      <span class="input-group-text">USD</span>
    </div>
    <div class="input-group">
      <span class="input-group-text"><iconify-icon icon="ph:user"></iconify-icon></span>
      <input class="form-control" placeholder="Employee name">
    </div>
  </div>
</div></body></html>
