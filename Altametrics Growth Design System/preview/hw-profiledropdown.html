<!-- @dsCard group="Components" -->
<!doctype html>
<html><head><meta charset="utf-8">
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<link rel="stylesheet" href="../global-icons.css">
<link rel="stylesheet" href="_base.css">
<style>
  body{ background:var(--body-bg); } .card{ background:var(--body-bg); }
  .dd-stage{ display:flex; padding:6px 0 10px; }
  .dd-stage .hw-dd{ position:static; box-shadow:var(--shadow); }
</style></head>
<body><div class="card">
  <div class="col"><div class="eyebrow">Profile dropdown · &lt;hw-header-profile&gt;</div><div class="muted" style="font-size:12px">Avatar menu · gradient header (avatar · language · Edit) then name, email, change password, Light Theme toggle, logout</div></div>
  <div class="dd-stage">
    <div class="hw-dd hw-profile-dd" role="menu">
      <div class="profile-section">
        <span class="profile-img" style="display:inline-flex;align-items:center;justify-content:center"><iconify-icon icon="ph:user-fill" style="color:var(--primaryDark);font-size:30px"></iconify-icon></span>
        <ul class="profile-setting">
          <li class="hw-lang-wrap"><span style="display:inline-flex;align-items:center;gap:6px;cursor:pointer"><img class="flag" src="https://flagcdn.com/us.svg" alt=""> English <iconify-icon icon="ph:caret-down" style="font-size:10px"></iconify-icon></span></li>
          <li>Edit</li>
        </ul>
      </div>
      <ul class="profile-data">
        <li style="cursor:default"><span><i class="pi"><iconify-icon icon="ph:user"></iconify-icon></i> R Dixit</span></li>
        <li style="cursor:default"><span><i class="pi"><iconify-icon icon="ph:envelope-simple"></iconify-icon></i> plum@22.com</span></li>
        <li><span><i class="pi"><iconify-icon icon="ph:key"></iconify-icon></i> Change Password</span></li>
        <li style="cursor:default">
          <span><i class="pi"><iconify-icon icon="ph:sun"></iconify-icon></i> Light Theme</span>
          <span class="fn-switch on" role="switch" aria-checked="true" aria-label="Light theme"></span>
        </li>
        <li class="red"><span><i class="pi"><iconify-icon icon="ph:power"></iconify-icon></i> Logout</span></li>
      </ul>
    </div>
  </div>
</div></body></html>
