<!-- @dsCard group="Components" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="_base.css"></head>
<body><div class="card">
  <div class="col"><div class="eyebrow">Toggles & choice</div><div class="muted" style="font-size:12px">Switch · checkbox · radio — all use <code class="mono">--blue</code> when on</div></div>
  <div class="row" style="gap:28px">
    <span class="fn-switch on"></span>
    <span class="fn-switch"></span>
    <span class="fn-switch on size-lg"></span>
    <span class="fn-switch size-sm on"></span>
  </div>
  <div class="row" style="gap:24px;margin-top:4px">
    <label class="fn-checkbox on"><span class="box"><svg viewBox="0 0 16 16" fill="none"><path d="M3 8l3.5 3.5L13 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>Email me updates</span></label>
    <label class="fn-checkbox"><span class="box"><svg viewBox="0 0 16 16" fill="none"><path d="M3 8l3.5 3.5L13 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>SMS alerts</span></label>
  </div>
  <div class="row" style="gap:24px">
    <label class="fn-radio on"><span class="dot"></span><span>Weekly</span></label>
    <label class="fn-radio"><span class="dot"></span><span>Monthly</span></label>
    <label class="fn-radio"><span class="dot"></span><span>Never</span></label>
  </div>
</div></body></html>
