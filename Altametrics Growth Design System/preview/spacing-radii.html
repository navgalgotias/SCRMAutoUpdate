<!-- @dsCard group="Spacing" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="_base.css"></head>
<body><div class="card">
  <div class="col"><div class="eyebrow">Radii & elevation</div></div>
  <div class="row" style="gap:24px;align-items:flex-end">
    <div class="sw" style="align-items:center"><div style="width:80px;height:56px;background:var(--bg-primary);border:1px solid var(--border-default-color);border-radius:4px"></div><div class="vr">4px · controls</div></div>
    <div class="sw" style="align-items:center"><div style="width:80px;height:56px;background:var(--bg-primary);border:1px solid var(--border-default-color);border-radius:var(--radius-sm)"></div><div class="vr">--radius-sm · 6px</div></div>
    <div class="sw" style="align-items:center"><div style="width:80px;height:56px;background:var(--bg-primary);border:1px solid var(--border-default-color);border-radius:var(--radius-md)"></div><div class="vr">--radius-md · 9px</div></div>
    <div class="sw" style="align-items:center"><div style="width:80px;height:56px;background:var(--bg-primary);border:1px solid var(--border-default-color);border-radius:999px"></div><div class="vr">999px · pills</div></div>
  </div>
  <div class="col" style="margin-top:6px"><div class="eyebrow">Shadow</div></div>
  <div class="row" style="gap:24px">
    <div class="sw" style="align-items:center"><div style="width:120px;height:56px;background:var(--bg-primary);border-radius:9px;box-shadow:var(--shadow)"></div><div class="vr">--shadow · popovers, dialogs</div></div>
  </div>
</div></body></html>
