<!-- @dsCard group="Components" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="_base.css"></head>
<body><div class="card">
  <div class="col"><div class="eyebrow">Button group</div><div class="muted" style="font-size:12px"><code class="mono">.btn-group</code> segmented control · active segment filled · <code class="mono">.btn-group-round</code> for the pill shape</div></div>
  <div class="row" style="gap:24px;align-items:center">
    <div class="btn-group btn-group-round" role="group" aria-label="View range">
      <button class="btn btn-outline-primary active" style="background:var(--blue);color:#fff" aria-pressed="true">Day</button>
      <button class="btn btn-outline-primary" aria-pressed="false">Week</button>
      <button class="btn btn-outline-primary" aria-pressed="false">Month</button>
    </div>
    <div class="btn-group" role="group" aria-label="Alignment">
      <button class="btn btn-outline-secondary active" style="background:var(--iron);color:#fff;border-color:var(--iron)" aria-pressed="true">Left</button>
      <button class="btn btn-outline-secondary" aria-pressed="false">Center</button>
      <button class="btn btn-outline-secondary" aria-pressed="false">Right</button>
    </div>
  </div>
</div></body></html>
