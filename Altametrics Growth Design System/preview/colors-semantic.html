<!-- @dsCard group="Colors" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="_base.css"></head>
<body><div class="card">
  <div class="col"><div class="eyebrow">Semantic bubbles</div><div class="muted" style="font-size:12px">Tinted status chips · <code class="mono">.bubble-*</code> (soft bg + dark text)</div></div>
  <div class="row" style="gap:8px">
    <span class="fn-tag bubble-primary">Primary</span>
    <span class="fn-tag bubble-success">Success</span>
    <span class="fn-tag bubble-warning">Warning</span>
    <span class="fn-tag bubble-danger">Danger</span>
    <span class="fn-tag bubble-info">Info</span>
    <span class="fn-tag bubble-orange">Orange</span>
    <span class="fn-tag bubble-secondary">Secondary</span>
  </div>
  <div class="col" style="margin-top:4px"><div class="eyebrow">Solid fills</div></div>
  <div class="row" style="gap:8px">
    <span class="pt-pill solid-primary">Active</span>
    <span class="pt-pill solid-success">Paid</span>
    <span class="pt-pill solid-warning">Pending</span>
    <span class="pt-pill solid-danger">Overdue</span>
    <span class="pt-pill outline-danger">Void</span>
    <span class="pt-pill outline-muted">Draft</span>
  </div>
</div></body></html>
