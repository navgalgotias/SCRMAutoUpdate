<!-- @dsCard group="Components" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="_base.css"></head>
<body><div class="card">
  <div class="col"><div class="eyebrow">Select</div><div class="muted" style="font-size:12px">ng-select replica · single, multi (chips), and disabled</div></div>
  <div class="row" style="gap:14px;align-items:flex-start">
    <div class="fn-select" style="flex:1">
      <span class="value">Full-time</span>
      <span class="caret caret-main"><svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </div>
    <div class="fn-select is-multi" style="flex:1">
      <span class="chip">Morning <span class="x">×</span></span>
      <span class="chip">Evening <span class="x">×</span></span>
      <span class="caret caret-main" style="margin-left:auto"><svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </div>
    <div class="fn-select" style="flex:1" aria-disabled="true">
      <span class="placeholder">Select store…</span>
      <span class="caret caret-main"><svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </div>
  </div>
</div></body></html>
