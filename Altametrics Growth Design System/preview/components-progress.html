<!-- @dsCard group="Components" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../global-icons.css">
<link rel="stylesheet" href="_base.css"></head>
<body><div class="card">
  <div class="col"><div class="eyebrow">Progress & float button</div></div>
  <div style="display:flex;flex-direction:column;gap:12px;max-width:420px">
    <div><div class="fn-progress"><div class="bar" style="width:72%"></div></div><div class="mono" style="margin-top:4px">primary · 72%</div></div>
    <div><div class="fn-progress success"><div class="bar" style="width:100%"></div></div><div class="mono" style="margin-top:4px">success · complete</div></div>
    <div><div class="fn-progress danger"><div class="bar" style="width:34%"></div></div><div class="mono" style="margin-top:4px">danger · 34%</div></div>
  </div>
  <div class="col" style="margin-top:6px"><div class="eyebrow">Float button</div></div>
  <div class="row" style="gap:16px;align-items:center">
    <span class="fn-float-btn" style="position:static;width:52px;height:52px;border-radius:50%;background:var(--blue);color:#fff;display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--shadow)">
      <svg width="22" height="22" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </span>
    <span class="mono">fn-float-btn · fixed bottom-right FAB</span>
  </div>
</div></body></html>
