<!-- @dsCard group="Colors" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="_base.css"></head>
<body><div class="card">
  <div class="col"><div class="eyebrow">Dark variants</div><div class="muted" style="font-size:12px">Used for hover / active / pressed states on top of the base semantic colors</div></div>
  <div class="sw-grid">
    <div class="sw"><div class="chip" style="background:var(--primaryDark)"></div><div class="nm">primaryDark</div><div class="vr">--primaryDark</div></div>
    <div class="sw"><div class="chip" style="background:var(--successDark)"></div><div class="nm">successDark</div><div class="vr">--successDark</div></div>
    <div class="sw"><div class="chip" style="background:var(--dangerDark)"></div><div class="nm">dangerDark</div><div class="vr">--dangerDark</div></div>
    <div class="sw"><div class="chip" style="background:var(--orangeDark)"></div><div class="nm">orangeDark</div><div class="vr">--orangeDark</div></div>
    <div class="sw"><div class="chip" style="background:var(--infoDark)"></div><div class="nm">infoDark</div><div class="vr">--infoDark</div></div>
    <div class="sw"><div class="chip" style="background:var(--ironDark)"></div><div class="nm">ironDark</div><div class="vr">--ironDark</div></div>
    <div class="sw"><div class="chip" style="background:var(--warningDark)"></div><div class="nm">warningDark</div><div class="vr">--warningDark</div></div>
    <div class="sw"><div class="chip" style="background:var(--secondaryDark)"></div><div class="nm">secondaryDark</div><div class="vr">--secondaryDark</div></div>
  </div>
</div></body></html>
