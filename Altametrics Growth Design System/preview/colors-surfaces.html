<!-- @dsCard group="Colors" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="_base.css"></head>
<body><div class="card">
  <div class="col"><div class="eyebrow">Surfaces & structure</div><div class="muted" style="font-size:12px">Light-theme surface tokens (a <code class="mono">.dark-theme</code> class on <code class="mono">&lt;html&gt;</code> swaps every value)</div></div>
  <div class="sw-grid">
    <div class="sw"><div class="chip" style="background:var(--body-bg)"></div><div class="nm">Body</div><div class="vr">--body-bg</div></div>
    <div class="sw"><div class="chip" style="background:var(--bg-primary)"></div><div class="nm">Surface</div><div class="vr">--bg-primary</div></div>
    <div class="sw"><div class="chip" style="background:var(--hover-bg-color)"></div><div class="nm">Hover</div><div class="vr">--hover-bg-color</div></div>
    <div class="sw"><div class="chip" style="background:var(--table-dark-cell)"></div><div class="nm">Table head</div><div class="vr">--table-dark-cell</div></div>
    <div class="sw"><div class="chip" style="background:var(--side-nav-bg)"></div><div class="nm">Side nav</div><div class="vr">--side-nav-bg</div></div>
    <div class="sw"><div class="chip" style="background:var(--input-bg);border-color:var(--input-border-color)"></div><div class="nm">Input</div><div class="vr">--input-bg</div></div>
    <div class="sw"><div class="chip" style="background:var(--ironLight)"></div><div class="nm">Iron light</div><div class="vr">--ironLight</div></div>
    <div class="sw"><div class="chip" style="background:#fff;border:2px solid var(--border-default-color)"></div><div class="nm">Border</div><div class="vr">--border-default-color</div></div>
  </div>
</div></body></html>
