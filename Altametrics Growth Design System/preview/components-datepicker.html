<!-- @dsCard group="Components" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../global-icons.css">
<link rel="stylesheet" href="_base.css"></head>
<body><div class="card">
  <div class="col"><div class="eyebrow">Date pickers</div><div class="muted" style="font-size:12px">Single date (prev / date / next pill group) and date-range (rounded input)</div></div>
  <div class="row" style="gap:20px;align-items:center">
    <div class="single-date-picker">
      <div class="btn-group btn-group-round" role="group">
        <button class="btn btn-sm btn-outline-secondary dp-prev"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M10 4L6 8L10 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="btn btn-sm btn-outline-secondary dp-center">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" class="dp-cal-icon"><rect x="2" y="3" width="12" height="11" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M5 1.5V4M11 1.5V4M2 7H14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <span class="dp-date">11/3/2026</span>
          <span class="dp-drop"><svg width="8" height="5" viewBox="0 0 10 6" fill="currentColor"><path d="M5 6L0 0H10L5 6Z"/></svg></span>
        </button>
        <button class="btn btn-sm btn-outline-secondary dp-next"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M6 4L10 8L6 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </div>
    <div class="date-range-picker-input">
      <span class="drp-cal-prefix"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><rect x="2" y="3" width="12" height="11" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M5 1.5V4M11 1.5V4M2 7H14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></span>
      <input class="form-control input-round" value="2026/03/11 - 2026/03/17" readonly>
      <span class="drp-drop"><svg width="8" height="5" viewBox="0 0 10 6" fill="currentColor"><path d="M5 6L0 0H10L5 6Z"/></svg></span>
    </div>
  </div>
</div></body></html>
