<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../global-icons.css">
<link rel="stylesheet" href="_base.css"></head>
<body><div class="card">
  <div class="col"><div class="eyebrow">Time picker</div><div class="muted" style="font-size:12px">fn-time-picker · typeable input + fn-global caret · 12h, duration, and next-day (+1) variants</div></div>
  <div class="row" style="gap:18px;align-items:flex-start">
    <div class="fn-time-picker-search" style="width:150px">
      <input class="form-control" value="9:00a" readonly>
      <i class="fn-global-dropdownArrow"></i>
    </div>
    <div class="fn-time-picker-search" style="width:150px">
      <input class="form-control" value="00:15" readonly>
      <i class="fn-global-dropdownArrow"></i>
    </div>
    <div class="fn-time-picker-search" style="width:170px">
      <input class="form-control" value="11:30p" readonly style="padding-right:46px">
      <span class="mextDay"><span>+1</span><span>Day</span></span>
    </div>
  </div>
  <div class="muted" style="font-size:11px;margin-top:2px">Single 12-hour · Duration (24h) · Overnight shift with the +1 Day flag</div>
</div></body></html>
