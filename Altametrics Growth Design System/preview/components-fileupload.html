<!-- @dsCard group="Components" -->
<!doctype html>
<html><head><meta charset="utf-8">
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<link rel="stylesheet" href="_base.css">
<style>
  .dz{ width:220px; padding:24px; border:2px dashed var(--input-border-color); border-radius:8px; text-align:center; background:var(--bg-primary); }
  .dz iconify-icon{ font-size:32px; color:var(--iron); }
  .dz .t{ font-size:12px; font-weight:500; margin-top:8px; }
  .file-list{ flex:1; border:1px solid var(--border-default-color); border-radius:8px; overflow:hidden; }
  .file-row{ padding:10px 14px; border-bottom:1px solid var(--border-default-color); display:flex; gap:12px; align-items:center; }
  .file-row:last-child{ border-bottom:0; }
  .file-row iconify-icon{ font-size:20px; }
  .file-meta{ display:flex; gap:8px; font-size:11px; color:var(--iron); white-space:nowrap; }
  .file-x{ width:28px; height:28px; border:1px solid var(--border-default-color); border-radius:6px; background:var(--bg-primary); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; color:var(--iron); flex-shrink:0; }
</style></head>
<body><div class="card">
  <div class="col"><div class="eyebrow">File upload · &lt;fn-img-upload&gt; / &lt;fn-files-upload&gt;</div><div class="muted" style="font-size:12px">Image + multi-file upload with preview, drag-and-drop, and progress</div></div>
  <div class="row" style="gap:20px;align-items:flex-start">
    <div class="dz">
      <iconify-icon icon="ph:image-square-duotone"></iconify-icon>
      <div class="t">Drop image or click to browse</div>
      <div class="muted" style="font-size:11px;margin-top:2px">PNG or JPG up to 2MB</div>
    </div>
    <div class="file-list">
      <div class="file-row">
        <iconify-icon icon="ph:file-text" style="color:var(--green)"></iconify-icon>
        <div style="flex:1">
          <div style="font-size:13px;font-weight:500">Shift-schedule-week-12.pdf</div>
          <div class="file-meta"><span>382 KB</span><span>•</span><span>Uploaded</span></div>
        </div>
        <button class="file-x" aria-label="Remove"><svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M2 2L10 10M10 2L2 10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
      </div>
      <div class="file-row">
        <iconify-icon icon="ph:file" style="color:var(--blue)"></iconify-icon>
        <div style="flex:1">
          <div style="font-size:13px;font-weight:500">Employee-onboarding.docx</div>
          <div class="file-meta"><span>1.4 MB</span><span>•</span><span>64%</span></div>
          <div class="fn-progress" style="margin-top:6px"><div class="bar" style="width:64%"></div></div>
        </div>
        <button class="file-x" aria-label="Remove"><svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M2 2L10 10M10 2L2 10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
      </div>
      <div class="file-row">
        <iconify-icon icon="ph:file" style="color:var(--blue)"></iconify-icon>
        <div style="flex:1">
          <div style="font-size:13px;font-weight:500">Photos-staff-meeting.zip</div>
          <div class="file-meta"><span>12.8 MB</span><span>•</span><span>28%</span></div>
          <div class="fn-progress" style="margin-top:6px"><div class="bar" style="width:28%"></div></div>
        </div>
        <button class="file-x" aria-label="Remove"><svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M2 2L10 10M10 2L2 10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
      </div>
    </div>
  </div>
</div></body></html>
