<!-- @dsCard group="Components" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../global-icons.css">
<link rel="stylesheet" href="_base.css">
<style>
  .drawer-stage{ display:flex; justify-content:flex-end; background:var(--cdk-overlay-backdrop); border-radius:8px; overflow:hidden; }
  .drawer-stage .fn-drawer{ position:static; height:auto; width:420px; border-radius:0; }
  .drawer-stage .drw-body{ overflow:visible; }
  .swrow{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:10px 14px; border:1px solid var(--border-default-color); border-radius:6px; background:var(--bg-primary); }
  .swrow + .swrow{ margin-top:10px; }
  .swrow .t{ font-weight:500; font-size:13px; margin-bottom:2px; }
  .swrow .d{ font-size:11.5px; color:var(--iron); }
</style></head>
<body><div class="card">
  <div class="col"><div class="eyebrow">Drawer</div><div class="muted" style="font-size:12px">ag-drawer-host · right-side panel · white header + bordered square close · scrollable body · divider footer (right-aligned)</div></div>
  <div class="drawer-stage">
    <div class="fn-drawer">
      <div class="drw-head">
        <span>Edit employee · Sana Ahmed</span>
        <button class="ds-iconbtn" aria-label="Close drawer"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 2L10 10M10 2L2 10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      </div>
      <div class="drw-body">
        <div class="form-group"><label class="fn-label">Name<span class="fn-required">*</span></label><input class="fn-input form-control" value="Sana Ahmed"></div>
        <div class="form-group"><label class="fn-label">Role</label>
          <div class="fn-select" style="width:100%"><span class="value">Manager</span><span class="caret caret-main" style="margin-left:auto"><svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
        </div>
        <div class="form-group"><label class="fn-label">Email<span class="fn-required">*</span></label><input class="fn-input form-control" value="sana@altametrics.com"></div>
        <div class="form-group"><label class="fn-label">Hourly rate</label>
          <div class="input-group"><span class="input-group-text">$</span><input class="form-control" value="32.00"><span class="input-group-text">USD</span></div>
        </div>
        <div class="divider"></div>
        <div class="swrow"><div><div class="t">Active employee</div><div class="d">Inactive employees are hidden from scheduling</div></div><span class="fn-switch on"></span></div>
        <div class="swrow"><div><div class="t">Receive notifications</div><div class="d">Schedule changes + shift reminders</div></div><span class="fn-switch on"></span></div>
      </div>
      <div class="drw-foot">
        <button class="btn btn-outline-secondary btn-sm">Cancel</button>
        <button class="btn btn-primary btn-sm">Save changes</button>
      </div>
    </div>
  </div>
</div></body></html>
