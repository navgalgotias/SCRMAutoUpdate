<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../global-icons.css">
<link rel="stylesheet" href="_base.css"></head>
<body><div class="card">
  <div class="col"><div class="eyebrow">Toaster</div><div class="muted" style="font-size:12px">Corner toasts · colored fill, left accent · auto-dismiss 4.2s</div></div>
  <div style="display:flex;flex-direction:column;gap:8px;max-width:380px">
    <div class="fn-toast success" style="color:#fff"><span class="icon">✓</span><div><div class="title">Saved</div>Schedule published to 12 employees.</div><span class="x">×</span></div>
    <div class="fn-toast danger" style="color:#fff"><span class="icon">!</span><div><div class="title">Save failed</div>Connection lost. Retry.</div><span class="x">×</span></div>
    <div class="fn-toast info" style="color:#fff"><span class="icon">i</span><div><div class="title">Heads up</div>2 punches need approval.</div><span class="x">×</span></div>
  </div>
</div></body></html>
