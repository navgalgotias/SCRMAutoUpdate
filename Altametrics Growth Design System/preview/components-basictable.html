<!-- @dsCard group="Components" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<style>
  table.tbl{ width:100%; border-collapse:collapse; border:1px solid var(--border-default-color); border-radius:8px; overflow:hidden; }
  .tbl th{ background:var(--table-dark-cell); text-transform:uppercase; font-size:11px; letter-spacing:.04em; font-weight:600; color:var(--body-textColor); text-align:left; padding:10px 14px; }
  .tbl th.num{ text-align:right; }
  .tbl td{ padding:10px 14px; border-top:1px solid var(--table-border-color); font-size:13px; }
  .tbl td.num{ text-align:right; font-family:var(--ds-mono); }
  .tbl td.id{ font-family:var(--ds-mono); color:var(--iron); }
  .tbl tbody tr:hover{ background:var(--table-hover-bg); }
</style></head>
<body><div class="card">
  <div class="col"><div class="eyebrow">Table</div><div class="muted" style="font-size:12px">Default <code class="mono">.tbl</code> structure · dense rows · uppercase header on <code class="mono">--table-dark-cell</code> · hover wash · status pills</div></div>
  <table class="tbl">
    <thead><tr><th>Employee</th><th>Role</th><th>Store</th><th class="num">Hours</th><th>Status</th></tr></thead>
    <tbody>
      <tr><td>Aisha Rahman</td><td>Shift lead</td><td class="id">STR-014</td><td class="num">38.5</td><td><span class="pt-pill solid-success" style="min-width:auto">Active</span></td></tr>
      <tr><td>Marco Klein</td><td>Line cook</td><td class="id">STR-014</td><td class="num">41.0</td><td><span class="pt-pill solid-warning" style="min-width:auto">Pending</span></td></tr>
      <tr><td>Jia Sun</td><td>Cashier</td><td class="id">STR-009</td><td class="num">22.0</td><td><span class="pt-pill outline-muted" style="min-width:auto">Draft</span></td></tr>
      <tr><td>Liam Okafor</td><td>Server</td><td class="id">STR-009</td><td class="num">29.5</td><td><span class="pt-pill solid-success" style="min-width:auto">Active</span></td></tr>
    </tbody>
  </table>
</div></body></html>
